name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SWIFT_VERSION: 6.3.3
  SWIFTLY_VERSION: 1.1.3
  SWIFTLY_SIGNING_FINGERPRINT: E813C892820A6FA13755B268F167DF1ACF9CE069

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      macos-tests: ${{ steps.macos-tests.outputs.macos-tests }}
      macos-tests-deferred: ${{ steps.macos-tests.outputs.macos-tests-deferred }}
      macos-tests-reason: ${{ steps.macos-tests.outputs.macos-tests-reason }}
      changed-path-count: ${{ steps.macos-tests.outputs.changed-path-count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect Swift build and test impact
        id: macos-tests
        shell: bash
        env:
          CI_PULL_REQUEST_DRAFT: ${{ github.event.pull_request.draft || false }}
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="${{ github.event.before }}"
          fi

          changed_paths="${RUNNER_TEMP}/changed-paths.txt"
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            git ls-files | awk '{ print "A\t" $0 }' > "$changed_paths"
          elif ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            echo "Base commit ${base_sha} is unavailable; running Swift builds and tests conservatively."
            git ls-files | awk '{ print "A\t" $0 }' > "$changed_paths"
          else
            git diff --name-status "$base_sha" "$GITHUB_SHA" > "$changed_paths"
          fi

          printf 'Changed paths:\n'
          sed 's/^/- /' "$changed_paths"
          ./Scripts/ci_macos_test_gate.sh "$changed_paths"

      - name: Summarize CI path gates
        if: ${{ always() }}
        shell: bash
        env:
          MACOS_TESTS: ${{ steps.macos-tests.outputs.macos-tests }}
          MACOS_TESTS_REASON: ${{ steps.macos-tests.outputs.macos-tests-reason }}
          CHANGED_PATH_COUNT: ${{ steps.macos-tests.outputs.changed-path-count }}
        run: |
          set -euo pipefail
          reason="${MACOS_TESTS_REASON:-<unset>}"
          reason="${reason//|/\\|}"
          {
            printf '### CI path gates\n\n'
            printf '| Field | Value |\n'
            printf '| --- | --- |\n'
            printf '| macOS Swift tests required | `%s` |\n' "${MACOS_TESTS:-<unset>}"
            printf '| macOS reason | %s |\n' "$reason"
            printf '| Changed path entries | `%s` |\n' "${CHANGED_PATH_COUNT:-<unset>}"
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install lint tools
        run: ./Scripts/install_lint_tools.sh swiftlint oxlint oxfmt typescript

      - name: Lint
        run: ./Scripts/lint.sh lint-linux

  swift-test-macos:
    needs: changes
    if: ${{ needs.changes.outputs.macos-tests == 'true' && needs.changes.outputs.macos-tests-deferred != 'true' }}
    # Apple-Silicon runners: ~2-4x faster Swift builds than the retired-path
    # Intel pool and much shorter queues (see #2585 for the measurements).
    # GitHub's Xcode 27 image (macOS 27 base); CI builds and tests with Xcode 27 only.
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode 27
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
          echo "DEVELOPER_DIR=/Applications/Xcode_27.0.app/Contents/Developer" >> "$GITHUB_ENV"
          [[ "$(/usr/bin/xcodebuild -version)" == Xcode\ 27* ]]
          /usr/bin/xcodebuild -version

      - name: Identify SwiftPM build context
        id: build-context
        run: python3 Scripts/ci_swiftpm_cache.py context --lane xcode27-arm64

      - name: Restore compiled SwiftPM cache
        id: compiled-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ steps.build-context.outputs.prefix }}${{ github.sha }}
          restore-keys: ${{ steps.build-context.outputs.prefix }}

      - name: Restore legacy dependency cache on a compiled-cache miss
        if: ${{ !steps.compiled-cache.outputs.cache-matched-key }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-xcode27-arm64-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            swiftpm-xcode27-arm64-

      - name: Swift toolchain version
        run: |
          set -euo pipefail
          swift --version
          swift package --version

      - name: Check app locales and Swift formatting
        run: ./Scripts/lint.sh lint-macos

      - name: Verify cached inputs and record current checkout
        env:
          BUILD_CONTEXT: ${{ steps.build-context.outputs.context }}
          COMPILED_CACHE_KEY: ${{ steps.compiled-cache.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          if [[ -z "$COMPILED_CACHE_KEY" ]]; then
            rm -f .build/ci-inputs.json
          fi
          python3 Scripts/ci_swiftpm_cache.py restore --context "$BUILD_CONTEXT" --clean-fallback
          # Record inputs before compiling; cache publication also requires a clean tree.
          python3 Scripts/ci_swiftpm_cache.py snapshot --context "$BUILD_CONTEXT"

      - name: Swift Test
        # Batch short suites; the runner isolates expensive suites without changing their deadlines.
        timeout-minutes: 75
        run: |
          touch "$RUNNER_TEMP/bars-tests-started"
          echo "Hosted tests run the complete inventory with two verified direct workers."
          BARS_TEST_GROUP_SIZE=8 \
            BARS_TEST_SUITE_TIMEOUT=120 \
            BARS_TEST_RETRY_NON_TIMEOUT_FAILURES=0 \
            ./Scripts/test.sh --direct-workers 2

      - name: Verify checkout before publishing compiled cache
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: git diff --exit-code HEAD --

      - name: Save successful main build for subsequent checkouts
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.compiled-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ steps.build-context.outputs.prefix }}${{ github.sha }}

      - name: Collect crash reports on failure
        if: ${{ failure() }}
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/bars-tests-started" ]]; then
            python3 Scripts/swift_test_diagnostics.py --since "$RUNNER_TEMP/bars-tests-started"
          fi

      - name: Summarize macOS tests
        if: ${{ always() }}
        shell: bash
        env:
          COMPILED_CACHE_KEY: ${{ steps.compiled-cache.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          xcode_version="$(/usr/bin/xcodebuild -version 2>/dev/null | tr '\n' ' ' || true)"
          {
            printf '### macOS Swift tests\n\n'
            printf '| Field | Value |\n'
            printf '| --- | --- |\n'
            printf '| Coverage | Full discovered inventory |\n'
            printf '| Workers | `2` direct workers on one runner |\n'
            printf '| Runner | `%s` |\n' "${RUNNER_NAME:-unknown}"
            printf '| Xcode | `%s` |\n' "${xcode_version:-unknown}"
            printf '| Compiled cache | `%s` |\n' "${COMPILED_CACHE_KEY:-miss}"
          } >> "$GITHUB_STEP_SUMMARY"

  prune-swiftpm-caches:
    needs: [swift-test-macos]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Keep one main compiled snapshot per macOS lane
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 Scripts/ci_prune_swiftpm_cache.py --repository "$GITHUB_REPOSITORY"

  lint-build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs:
      - changes
      - lint
      - swift-test-macos
    if: ${{ always() && !cancelled() }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify required CI jobs
        run: |
          ./Scripts/ci_verify_test_jobs.sh \
            "${{ needs.lint.result }}" \
            "${{ needs.changes.result }}" \
            "${{ needs.changes.outputs.macos-tests }}" \
            "${{ needs.swift-test-macos.result }}" \
            "${{ needs.changes.outputs.macos-tests-deferred }}"

      - name: Summarize aggregate CI gate
        if: ${{ always() }}
        shell: bash
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          MACOS_TESTS: ${{ needs.changes.outputs.macos-tests }}
          MACOS_TESTS_DEFERRED: ${{ needs.changes.outputs.macos-tests-deferred }}
          MACOS_TESTS_REASON: ${{ needs.changes.outputs.macos-tests-reason }}
          MACOS_RESULT: ${{ needs.swift-test-macos.result }}
        run: |
          set -euo pipefail
          reason="${MACOS_TESTS_REASON:-<unset>}"
          reason="${reason//|/\\|}"
          {
            printf '### Aggregate CI gate\n\n'
            printf '| Field | Value |\n'
            printf '| --- | --- |\n'
            printf '| lint result | `%s` |\n' "$LINT_RESULT"
            printf '| changes result | `%s` |\n' "$CHANGES_RESULT"
            printf '| macOS Swift tests required | `%s` |\n' "${MACOS_TESTS:-<unset>}"
            printf '| macOS Swift tests deferred | `%s` |\n' "${MACOS_TESTS_DEFERRED:-<unset>}"
            printf '| macOS gate reason | %s |\n' "$reason"
            printf '| swift-test-macos result | `%s` |\n' "$MACOS_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
